<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>weapp org icon closeup</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #e8eee9;
        color: #0d1712;
      }
      h1 {
        font-size: 14px;
        font-weight: 650;
        margin: 0 0 16px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #0e7958;
      }
      section {
        padding: 32px;
      }
      .row {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }
      figure {
        margin: 0;
        background: #f4f7f5;
        border-radius: 8px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        width: 220px;
      }
      figure.dark {
        background: #0b110e;
        color: #edf5f0;
      }
      figure img {
        width: 160px;
        height: 160px;
        display: block;
      }
      figcaption {
        font-size: 12px;
        color: #5a6861;
      }
      figure.dark figcaption {
        color: #aab8b0;
      }
    </style>
  </head>
  <body>
    <section>
      <h1>Color · 160px</h1>
      <div class="row">
        <figure>
          <img src="A-hive.svg" alt="A hive" />
          <figcaption>A Hive</figcaption>
        </figure>
        <figure>
          <img src="A-hive-badge.svg" alt="A hive badge" />
          <figcaption>A Hive badge</figcaption>
        </figure>
        <figure>
          <img src="B-vessel.svg" alt="B vessel" />
          <figcaption>B Vessel</figcaption>
        </figure>
        <figure>
          <img src="C-cascade.svg" alt="C cascade" />
          <figcaption>C Cascade</figcaption>
        </figure>
        <figure>
          <img src="D-w-windows.svg" alt="D W" />
          <figcaption>D W-windows</figcaption>
        </figure>
        <figure>
          <img src="E-fan.svg" alt="E deck" />
          <figcaption>E Deck</figcaption>
        </figure>
        <figure>
          <img src="F-hub.svg" alt="F hub" />
          <figcaption>F Hub</figcaption>
        </figure>
      </div>
    </section>
    <section style="background: #0b110e">
      <h1 style="color: #69c7a5">Inverse · 160px</h1>
      <div class="row">
        <figure class="dark">
          <img src="A-hive-inverse.svg" alt="" />
          <figcaption>A Hive</figcaption>
        </figure>
        <figure class="dark">
          <img src="A-hive-badge.svg" alt="" />
          <figcaption>A Hive badge</figcaption>
        </figure>
        <figure class="dark">
          <img src="B-vessel.svg" alt="" />
          <figcaption>B Vessel</figcaption>
        </figure>
        <figure class="dark">
          <img src="C-cascade-inverse.svg" alt="" />
          <figcaption>C Cascade</figcaption>
        </figure>
        <figure class="dark">
          <img src="D-w-windows-inverse.svg" alt="" />
          <figcaption>D W-windows</figcaption>
        </figure>
        <figure class="dark">
          <img src="E-fan-inverse.svg" alt="" />
          <figcaption>E Deck</figcaption>
        </figure>
        <figure class="dark">
          <img src="F-hub-inverse.svg" alt="" />
          <figcaption>F Hub</figcaption>
        </figure>
      </div>
    </section>
  </body>
</html>
